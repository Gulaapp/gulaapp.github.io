<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="gula-version" content="2026-11-09.3">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111015">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-1.png">
<link rel="apple-touch-icon" href="icon-192-1.png">
<title>Gula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app informativa de una columna para celular; encabezado fijo, lista de negocios y perfil con menú; pedidos por WhatsApp */
:root{
  --bg:#F8F6F3; --surface:#FFFFFF; --ink:#111015; --muted:#67615B; --line:#ECE6DF;
  --accent:#F26A1B; --accent-ink:#FFFFFF; --sea:#D9560E; --sea-soft:#FDEDE2;
  --ok:#1F8A4C; --off:#B03A3A; --chip:#F2EDE7; --wa:#1E9E55; --wa-ink:#FFFFFF;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0D0C; --surface:#1A1816; --ink:#F5F2EE; --muted:#ADA59D; --line:#2F2A26;
  --accent:#FF9A52; --accent-ink:#1A0A02; --sea:#FFB27A; --sea-soft:#2E1E14;
  --ok:#5BC98A; --off:#EC8A8A; --chip:#24201D; --wa:#3CC077; --wa-ink:#06200F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D0C; --surface:#1A1816; --ink:#F5F2EE; --muted:#ADA59D; --line:#2F2A26;
  --accent:#FF9A52; --accent-ink:#1A0A02; --sea:#FFB27A; --sea-soft:#2E1E14;
  --ok:#5BC98A; --off:#EC8A8A; --chip:#24201D; --wa:#3CC077; --wa-ink:#06200F; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.logo span{color:var(--accent)}
.zone{font-size:12px;color:var(--muted);padding:6px 0;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zone b{color:var(--ink);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.search svg{flex:none;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.giros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px 4px;scroll-snap-type:x proximity}
.giros::-webkit-scrollbar{display:none}
.giro{flex:none;width:150px;scroll-snap-align:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.giro b{font-size:14px;line-height:1.2}
.giro small{font-size:11.5px;color:var(--muted);line-height:1.25}
.giro .gn{font-family:var(--display);font-weight:800;font-size:13px;color:var(--accent)}
.giro[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink)}
.subs{margin-top:10px}
.chip.sub{background:transparent;border:1px solid var(--line);font-weight:600;font-size:13px;padding:6px 12px}
.chip.sub[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin:6px 0 12px}
.link{font-size:12px;font-weight:700;color:var(--sea)}
h2.sec{font-family:var(--display);font-weight:800;font-size:19px;margin:18px 0 10px;text-wrap:balance}
.list{display:flex;flex-direction:column;gap:14px}
.card{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--surface);border-radius:var(--r);padding:10px;text-align:left;width:100%;border:1px solid var(--line)}
.ph{border-radius:10px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:28px;position:relative;overflow:hidden}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 8px,transparent 8px 18px)}
.ph span{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.bcard{display:flex;flex-direction:column;width:100%;padding:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.bcard .ph{width:100%}
.bcard em{position:absolute;z-index:1;font-style:normal;font-family:var(--body);font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.bcard .bstate{top:12px;left:12px;background:rgba(255,255,255,.92);color:var(--ok)}.bcard .bstate.closed{color:var(--off)}
.bcard .bcat{left:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:14px}
.dhead .dh{margin:0;min-width:0}
.dstar{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;padding-top:6px}
.dstar b{font-family:var(--display);font-size:20px;line-height:1}
.dmeta{margin-top:4px}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px}
.rbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 8px;font-weight:700;font-size:14.5px}
.rbtn[data-rvrate]{border-color:#F2A516;color:#B47400}
.stats{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:14px}.stats .stars{font-size:16px}.stats .dot{color:var(--muted)}.stats .vn{color:var(--ink)}
.bbody h3,.adb h3{margin:0;font-family:var(--display);font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.bbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.btop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.btop h3{margin:0;font-family:var(--display);font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.bpr{color:var(--muted);font-weight:700;font-size:14px}
.brate{display:flex;align-items:center;gap:6px;font-size:14px}.brate .stars{font-size:16px}
.bline{font-size:14px;color:var(--muted)}
.bfoot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.bgo{margin-left:auto;font-weight:700;color:var(--accent);font-size:14px}
.list{gap:18px}
.card .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.card h3{margin:0;font-size:16px;font-weight:700;line-height:1.2}
.meta{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.open{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.closed{background:color-mix(in srgb,var(--off) 15%,transparent);color:var(--off)}
.star{color:var(--accent);font-weight:700}
.logoutbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;background:linear-gradient(transparent,var(--bg) 40%);padding-top:20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logoutbtn{display:block;box-shadow:0 4px 14px rgba(0,0,0,.12);border:1px solid var(--line);background:var(--surface);color:var(--off);border-radius:999px;padding:10px 22px;font-weight:700;font-size:14px}
.logoutbtn.sure{background:var(--off);color:#fff;border-color:var(--off)}
.adminbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--sea-soft);color:var(--sea);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;margin-top:4px}
.adminbar .ab{display:flex;gap:6px}
.adminbar button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--ink)}
.adminbar button.out{color:var(--off)}
.finder{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px 14px;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 18%,transparent)}
.finder svg{flex:none;color:var(--accent)}
.finder input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.finder input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.finder .x{flex:none;width:28px;height:28px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:700}
.secs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.secs button{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 16px;line-height:1.4}
.hint b{color:var(--ink)}
.why{font-size:12.5px;font-weight:600;color:var(--sea)}
.explore{width:100%;margin-top:12px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px 16px;font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.subgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.subtile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:76px}
.subtile b{font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.subtile small{font-size:12px;color:var(--muted)}
.ad{display:flex;flex-direction:column;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;width:100%}
.ad .ph{border-radius:0;aspect-ratio:16/9;font-size:44px}
.ad .ph em{position:absolute;top:10px;left:10px;z-index:1;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.45);color:#fff;padding:3px 8px;border-radius:999px;font-family:var(--body)}
.adb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.adb h3{margin:0;font-size:18px;font-weight:700}
.adb p{margin:2px 0 4px;font-size:14px}
.adcta{font-weight:700;color:var(--sea);font-size:14px}
.empty{padding:30px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
/* perfil */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:8px 0}
.hero{border-radius:var(--r);aspect-ratio:16/9;font-size:44px}
.dh{margin:14px 0 4px;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.about{margin:10px 0 14px;max-width:65ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.week{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-variant-numeric:tabular-nums}
.week .today{font-weight:700;color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gallery .ph{font-size:12px;font-family:var(--body);font-weight:700;align-items:end;justify-items:start;padding:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
.tabs::-webkit-scrollbar{display:none}
.menu-sec{scroll-margin-top:60px}
.menu-sec h4{font-family:var(--display);font-size:18px;margin:16px 0 4px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.item .n{font-weight:600}
.item .d{font-size:13px;color:var(--muted)}
.item .p{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.badge{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px}
.wabar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(transparent,var(--bg) 30%);padding-top:18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.wabtn{width:100%;max-width:528px;background:var(--wa);color:var(--wa-ink);border-radius:999px;padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.wanum{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
/* bienvenida */
.ob{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.ob .in{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px}
.ob.welcome{background:#111015;color:#FFFFFF}
.ob.welcome .bigname span{color:#FF9A52}
.ob.welcome .bigname{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,110px);line-height:.9;letter-spacing:-.04em;margin-top:auto}
.ob.welcome p{font-size:19px;max-width:22ch;margin:0}
.primary{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px;font-weight:700;font-size:16px}
.ob.welcome .primary{background:#F26A1B;color:#FFFFFF}
.ob h2{font-family:var(--display);font-weight:800;font-size:28px;margin:8px 0 0;text-wrap:balance}
.ob .lead{color:var(--muted);margin:0;max-width:40ch}
.ob .art{flex:1;display:grid;place-items:center;min-height:180px}
.ob .art svg{width:150px;height:150px;color:var(--sea)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--accent);width:20px}
.skip{font-weight:600;color:var(--muted);padding:10px;text-align:center;width:100%}
.ob.welcome .dots i{background:rgba(255,255,255,.4)}.ob.welcome .dots i.on{background:var(--accent-ink)}
.sys-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:24px}
.sys{background:#2B3133;color:#E8EEF0;border-radius:24px;padding:22px 18px;width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:8px}
.sys b{font-size:17px;font-weight:500;margin-bottom:8px}
.sys button{background:#BFE9F5;color:#0B4F63;border-radius:12px;padding:12px;font-weight:500}
.sys small{color:#9FB0B5;font-size:11.5px;margin-top:4px}
/* administración */
.adm-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.adm-top .logo small{font-family:var(--body);font-size:12px;font-weight:700;color:var(--sea);margin-left:6px;letter-spacing:.04em;text-transform:uppercase}
.adm-actions{display:flex;gap:6px}
.btn2{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px}
.seg{display:grid;grid-template-columns:1.25fr 1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{border-radius:9px;padding:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.arow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.arow h3{margin:0;font-size:16px}
.mnum{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--accent)}
.mnum span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13.5px}
.pkgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.pkg-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.pkg-card.promo{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.pk-h{display:flex;flex-direction:column;gap:2px}.pk-h b{font-size:15px}.pk-h span{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em}.pk-h small{font-size:12px;font-weight:600;color:var(--muted)}
.pkg-card ul{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:4px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.kpis b{font-family:var(--display);font-size:22px;letter-spacing:-.03em}.kpis span{font-size:12px;color:var(--muted)}
.kpis .ktot{background:var(--ink);border-color:var(--ink)}.kpis .ktot b,.kpis .ktot span{color:var(--bg)}
.tag.pkg.basico{background:var(--chip);color:var(--ink)}.tag.pkg.promo{background:var(--accent);color:var(--accent-ink)}
.redes{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 2px;font-size:12.5px;color:var(--muted)}
.ad{display:flex;flex-direction:column}
.admedia{position:relative;aspect-ratio:16/10;background:var(--chip)}
.admedia>em{position:absolute;top:12px;left:12px;z-index:2;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(17,16,21,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:5px 10px;border-radius:999px;pointer-events:none}
.adcount{position:absolute;right:12px;bottom:12px;z-index:2;font-size:12px;font-weight:700;background:rgba(17,16,21,.55);color:#fff;padding:4px 10px;border-radius:999px;pointer-events:none}
.adcar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}.adcar::-webkit-scrollbar{display:none}
.adslide{flex:none;width:100%;height:100%;scroll-snap-align:start;background:center/cover no-repeat var(--chip);padding:0;display:block}
.adslide .ph{width:100%;height:100%;aspect-ratio:auto;border-radius:0;font-size:40px}
button.adb{text-align:left;width:100%;background:transparent}
.apgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.apitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.apimg{aspect-ratio:16/10;background:center/cover no-repeat var(--chip);position:relative}
.apn,.apnew{position:absolute;top:8px;font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px}

function adSummary(a){a=a||{};const f=a.desde&&a.vence?`Del ${fmtDate(a.desde)} al ${fmtDate(a.vence)}`:a.desde?`Desde el ${fmtDate(a.desde)}`:a.vence?`Hasta el ${fmtDate(a.vence)}`:"Sin fecha límite";
 const h=a.hi&&a.hf&&a.hi!==a.hf?` · de ${fmtT(a.hi)} a ${fmtT(a.hf)}`:" · todo el día";return f+h}

 return `<div class="ad"><div class="admedia">${media}</div>

let CITY={name:"",busy:false};
try{CITY.name=(localStorage.getItem("gula_ciudad")||"").replace(/^municipio de\s+/i,"")}catch(e){}
async function cityFrom(lat,lon){
 try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`);const j=await r.json();const n=(j.city||j.locality||j.principalSubdivision||"").replace(/^municipio de\s+/i,"");if(n)return n}catch(e){}
 try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&accept-language=es&lat=${lat}&lon=${lon}`);const j=await r.json();const a=j.address||{};return a.city||a.town||a.village||a.municipality||a.county||""}catch(e){}
 return ""}
function locate(ask){
 if(!navigator.geolocation){if(ask)toast("Tu celular no permite detectar la ubicación.");return}
 CITY.busy=true;if(S.view==="home")render(true);
 navigator.geolocation.getCurrentPosition(async p=>{const n=await cityFrom(p.coords.latitude.toFixed(4),p.coords.longitude.toFixed(4));
   CITY.busy=false;if(n){CITY.name=n;try{localStorage.setItem("gula_ciudad",n)}catch(e){}}else if(ask)toast("No pudimos saber tu ciudad. Intenta de nuevo.");
   if(S.view==="home")render(true)},
  e=>{CITY.busy=false;if(ask)toast(e.code===1?"Permite la ubicación de Gula en los ajustes de tu celular para ver tu ciudad.":"No pudimos obtener tu ubicación. Intenta de nuevo.");if(S.view==="home")render(true)},
  {enableHighAccuracy:false,timeout:15000,maximumAge:300000})}

function servView(){
 const GS=GIROS.filter(g=>g.k!=="alimentos");const q=norm(S.vq||"");
 let res="";
 if(q){const subs=[];GS.forEach(g=>matchSubs(g,q).forEach(sb=>subs.push([g,sb])));
  const negs=visibles().filter(b=>b.g!=="alimentos").filter(b=>{const c=colOf(b);return norm(b.n).includes(q)||norm(b.s).includes(q)||norm(c.n).includes(q)||norm(c.loc).includes(q)||norm(b.about||"").includes(q)});
  res=`${subs.length?`<p class="meta" style="margin:4px 0 8px">Ir directo a:</p><div class="secs">${subs.slice(0,8).map(([g,sb])=>`<button class="chip" data-gosub="${g.k}|${esc(sb)}">${esc(sb)} <span class="abub" aria-hidden="true">→</span></button>`).join("")}</div>`:""}
  <div class="list" style="margin-top:12px">${negs.length?negs.map(b=>card(b,`${esc(b.s)} · Col. ${esc(colOf(b).n)}`)).join(""):subs.length?"":`<div class="empty">No encontramos "${esc((S.vq||"").trim())}". Prueba con otra palabra.</div>`}</div>`}
 return `<header class="top" style="padding-bottom:4px"><button class="back" data-go="home"><span class="bk-i" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>Inicio</button><span class="ztag d">🛠️ GULA SERVICIOS</span></header>

 `}`}

const finder=(id,val,ph,label)=>`<div class="finder"><label for="${id}" style="display:contents">${FIND_ICON}</label><input id="${id}" type="search" enterkeyhint="search" placeholder="${esc(ph)}" value="${esc(val)}" aria-label="${esc(label)}" aria-describedby="${id}hint">${val?`<button class="x" data-clear="${id}" aria-label="Borrar búsqueda">✕</button>`:""}</div>`;
/* palabras que llevan a cada sección: "tacos" lleva a Taquerías, etc. */
const EVT="Servicio para eventos";
const SUBWORDS={"Snacks":"snack snacks tostilocos dorilocos maruchan elote elotes esquites papas chicharrones botana botanas","Servicio para eventos":"evento eventos banquete banquetes taquiza taquizas fiesta fiestas boda bodas xv bautizo catering","Taquerías":"taco tacos taqueria","Hamburgueserías":"hamburguesa hamburguesas burger","Pizzerías":"pizza pizzas","Panaderías":"pan","Pastelerías":"pastel pasteles","Cafeterías":"cafe","Fruterías":"fruta frutas","Carnicerías":"carne carnes","Hot dogs":"hotdog hot dog dogos jochos","Mariscos":"marisco mariscos ceviche aguachile","Marisquerías":"marisco mariscos pescado","Fonditas":"fonda comida corrida","Cenadurías":"cena pozole","Loncherías":"lonche lonches torta tortas","Puestos de comida":"puesto antojitos","Restaurantes":"restaurante","Barberías":"barba barbero corte","Uñas":"unas manicure","Estéticas":"estetica corte","Talleres mecánicos":"taller mecanico","Reparación de celulares":"celular celulares"};
function matchSubs(G,q){q=norm(q);if(q.length<3)return[];
 return G.subs.filter(s=>{const n=norm(s);const w=norm(SUBWORDS[s]||"");return n.includes(q)||q.includes(n)||w.split(" ").some(x=>x&&(x.startsWith(q)||q.startsWith(x)&&x.length>=3))})}
function giroView(){
 const G=GIROS.find(x=>x.k===S.giro);const food=G.k==="alimentos";
 return `<header class="top" style="padding-bottom:4px"><button class="back" data-go="${food?"home":"serv"}"><span class="bk-i" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>${food?"Inicio":"Gula Servicios"}</button><span class="ztag ${food?"":"d"}">${food?"🍔 GULA FOOD":"🛠️ GULA SERVICIOS"}</span></header>

 ${S.gq.trim()?"":adsRow(adsFor(b=>b.g===G.k&&b.s!==EVT),food?"De comida":"De "+esc(G.n))}
 ${S.gq.trim()?giroResults(G):`${G.subs.includes(EVT)?(()=>{const n=visibles().filter(b=>b.g===S.giro&&b.s===EVT).length;return `<button class="evtile" data-sub="${EVT}"><span class="ev-i" aria-hidden="true">🎉</span><span class="ev-t"><small>Contrata para tu fiesta</small><b>Servicio para eventos</b><em>Banquetes, taquizas, snacks y más · ${n?n+(n===1?" negocio":" negocios"):"Próximamente"}</em></span><span class="ev-a" aria-hidden="true">→</span></button>`})():""}<div class="subgrid">${G.subs.filter(s=>s!==EVT).map(s=>{const n=visibles().filter(b=>b.g===S.giro&&b.s===s).length;
  return `<button class="subtile" data-sub="${esc(s)}"><b>${esc(s)}</b><small>${n?n+(n===1?" negocio":" negocios"):"Próximamente"}</small></button>`}).join("")}</div>
`}`}

function giroResults(G){
 const q=norm(S.gq);
 const res=visibles().filter(b=>b.g===G.k).map(b=>{const c=colOf(b);const why=[];
  if(norm(c.n).includes(q)||norm(c.loc).includes(q)||norm(b.calle).includes(q))why.push("Col. "+c.n+", "+c.loc);
  const dishes=allDishes(b).filter(i=>norm(i.n+" "+(i.d||"")).includes(q)).map(i=>i.n);
  if(dishes.length)why.push("Vende: "+dishes.slice(0,3).join(", "));
  if(!why.length&&norm(b.n+" "+b.s).includes(q))why.push(b.s);
  return why.length?{b,why:why.join(" · ")}:null}).filter(Boolean);
 const ms=matchSubs(G,S.gq);
 return `${ms.length?`<p class="meta" style="margin:0 0 8px">Ir directo a:</p><div class="secs">${ms.map(x=>`<button data-sub="${esc(x)}">${esc(x)} <span class="abub" aria-hidden="true">→</span></button>`).join("")}</div>`:""}<h2 class="sec" style="margin-top:0">${res.length} ${res.length===1?"resultado":"resultados"} para "${esc(S.gq.trim())}"</h2>
 <div class="list">${res.length?res.map(r=>card(r.b,r.why)).join(""):`<div class="empty">Ningún negocio de ${G.n} coincide con "${esc(S.gq.trim())}". Prueba con otra colonia o platillo.</div>`}</div>`}

const servList=b=>String(b.servicios||"").split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
const EVCHIPS=["Taquiza","Birria","Pozole","Mariscos","Banquete","Parrillada","Snacks","Mesa de dulces","Pastel","Bebidas"];
function eventosView(){
 const all=visibles().filter(b=>b.g==="alimentos"&&b.s===EVT);const q=norm(S.eq||"");
 const res=q?all.map(b=>{const c=colOf(b);const why=[];const sv=servList(b).filter(x=>norm(x).includes(q)||q.includes(norm(x)));
   if(sv.length)why.push("Ofrece: "+sv.slice(0,4).join(", "));
   if(norm(b.n).includes(q))why.push("Nombre");
   if(!sv.length&&norm(b.about||"").includes(q))why.push("Lo menciona en su descripción");

   return why.length?{b,why:why.join(" · ")}:null}).filter(Boolean):[];
 return `<header class="top" style="padding-bottom:4px"><button class="back" data-go="${S.evHome?"home":"giro"}"><span class="bk-i" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>${S.evHome?"Inicio":"Gula Food"}</button></header>
 <div class="evhead"><span aria-hidden="true">🎉</span><div><h1 class="dh" style="margin:0">Servicio para eventos</h1><p class="meta" style="margin:2px 0 0">Banquetes, taquizas, snacks y más · ${all.length} ${all.length===1?"negocio":"negocios"}</p></div></div>
 <h2 class="evq">¿Qué tipo de alimento buscas para tu evento?</h2>
 ${finder("eq",S.eq||"","Ej. taquiza, birria, mariscos…","Qué alimento buscas para tu evento")}
 <div class="evchips">${EVCHIPS.map(x=>`<button class="chip" data-eqchip="${x}" aria-pressed="${norm(x)===q}">${x}</button>`).join("")}</div>
 ${q?"":adsRow(adsFor(b=>b.g==="alimentos"&&b.s===EVT),"Para tu evento")}
 ${q?`<h2 class="sec" style="margin-top:14px">${res.length} ${res.length===1?"resultado":"resultados"} para "${esc((S.eq||"").trim())}"</h2>
  <div class="list">${res.length?res.map(r=>card(r.b,r.why)).join(""):`<div class="empty">Todavía no hay negocios de eventos que ofrezcan "${esc((S.eq||"").trim())}". Revisa el catálogo completo.</div>`}</div>`:""}
 <button class="evcat" data-evcat aria-expanded="${!!S.evcat}"><span aria-hidden="true">📋</span><span><b>Catálogo de negocios para eventos</b><small>Ve todos los que prestan el servicio (${all.length})</small></span><span class="chev" aria-hidden="true">${S.evcat?"↑":"↓"}</span></button>
 ${S.evcat?`<div class="list">${all.length?all.map(b=>card(b,servList(b).length?"Ofrece: "+servList(b).slice(0,4).join(", "):undefined)).join(""):`<div class="empty">Pronto habrá negocios para eventos en Gula.</div>`}</div>`:""}`}
function subView(){
 if(S.sub===EVT&&S.giro==="alimentos")return eventosView();
 const G=GIROS.find(x=>x.k===S.giro);
 const all=visibles().filter(b=>b.g===S.giro&&b.s===S.sub);
 const q=norm(S.sq);const fav=G.k==="alimentos"?"restaurante":"negocio";
 const list=q?all.map(b=>{const c=colOf(b);const why=[];
   if(norm(b.n).includes(q))why.push("Nombre");
   if(norm(c.n).includes(q)||norm(c.loc).includes(q)||norm(b.calle).includes(q))why.push("Col. "+c.n+", "+c.loc);

 $("#app").innerHTML=v==="detail"?detail():v==="menu"?menuView():v==="sub"?subView():v==="giro"?giroView():v==="serv"?servView():v==="login"?loginView():v==="adm"?admView():v==="edit"?editView():v==="adpub"?adPubView():v==="stats"?statsView():home();

  :`<div class="wabar"><div style="width:100%;max-width:528px"><button class="wabtn" data-cdirect>${WAICON} Generar pedido mediante WhatsApp</button><div class="wanum">Agrega productos del menú o escribe tu pedido · ${waShow(b.wa)}</div></div></div>`;
 renderSheet();
 renderOpt();
 renderPend();

 renderRev();
 renderAd();

 setTimeout(moreHint,60);
 if(v==="detail"||v==="menu")loadPh(S.biz);if(v==="edit"&&S.draft)loadPh(S.draft.id);

let toastT;function toast(msg){$("#toastroot").innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{$("#toastroot").innerHTML=""},2600)}
const go=v=>{S.view=v;S.err="";S.confirm=null;render()};

/* ---------- Fotos: se reducen para que pesen poco ---------- */
function shrink(file,mx=720,qq=0.62){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
 img.onload=()=>{const m=mx,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",qq))};
 img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

 if(t.dataset.mt!==undefined){D.menu[+t.dataset.mt].t=t.value;return}
 if(t.dataset.og&&t.tagName!=="SELECT"){const[si,ii,gi,f]=t.dataset.og.split(",");D.menu[+si].items[+ii].opts[+gi][f]=t.value;return}
 if(t.dataset.oc){const[si,ii,gi,ci,f]=t.dataset.oc.split(",");D.menu[+si].items[+ii].opts[+gi].ch[+ci][f]=t.value;return}

});
function setPath(o,p,v){const k=p.split(".");let x=o;while(k.length>1)x=x[k.shift()];x[k[0]]=v}
document.addEventListener("change",e=>{
 const t=e.target;if(t.id==="ap_files"&&S.ap){const files=[...t.files].slice(0,6-S.ap.items.length);
  Promise.all(files.map(f=>shrink(f,1000,0.7).catch(()=>null))).then(r=>{r.filter(Boolean).forEach(u=>S.ap.items.push({img:u,nuevo:true}));if(r.some(x=>!x))S.ap.err="Alguna foto no se pudo leer.";render(true)});return}
 if(t.dataset.red){const[id,k]=t.dataset.red.split(",");const b=DB.negocios.find(x=>x.id===id);if(!b)return;const r={...redesOf(b),[k]:t.checked};
  updateDoc(doc(fs,"negocios",id),{redes:r}).then(()=>{b.redes=r}).catch(e=>{fail(e);t.checked=!t.checked});return}
 if(S.view!=="edit")return;const D=S.draft;
 if(t.dataset.mph&&t.files&&t.files[0]){const[si,ii]=t.dataset.mph.split(",").map(Number);const it=D.menu[si].items[ii];
  shrink(t.files[0],520,0.6).then(u=>{const id=uid();PHNEW[id]=u;it.ph=id;render(true)}).catch(()=>{S.err="Esa foto no se pudo leer. Intenta con otra.";render(true)});return}
 if(t.id==="f_fotos"){const files=[...t.files].slice(0,4-D.fotos.length);Promise.all(files.map(f=>shrink(f).catch(()=>null))).then(r=>{const ok=r.filter(Boolean);D.fotos.push(...ok);if(ok.length<files.length)S.err="Alguna foto no se pudo leer. Intenta con otra.";render(true)});return}
 if(t.dataset.f){const v=t.type==="checkbox"?t.checked:t.value;setPath(D,t.dataset.f,v);if(t.dataset.f==="g"){D.s=GIROS.find(x=>x.k===v).subs[0];render(true)}return}
 if(t.dataset.hon!==undefined){const d=+t.dataset.hon;D.hours[d]=t.checked?[9,18]:null;render(true);return}
 if(t.dataset.ho){const[d,k]=t.dataset.ho.split(",").map(Number);if(D.hours[d])D.hours[d][k]=+t.value;return}
 if(t.dataset.ex!==undefined){const x=EXTRAS[+t.dataset.ex];D.extras=t.checked?[...D.extras,x]:D.extras.filter(y=>y!==x);return}
 if(t.dataset.og&&t.tagName==="SELECT"){const[si,ii,gi,f]=t.dataset.og.split(",");D.menu[+si].items[+ii].opts[+gi][f]=t.value;render(true);return}
 if(t.dataset.mc){const[si,ii,f]=t.dataset.mc.split(",");D.menu[+si].items[+ii][f]=t.checked;return}
});

  for(const x of delIds){try{await deleteDoc(doc(fs,"platos",x))}catch(e){console.error(e)}delete PH[x]}
 }).then(()=>{const i=DB.negocios.findIndex(x=>x.id===rec.id);if(i>=0)DB.negocios[i]=rec;else DB.negocios.push(rec);S.draft=null;S.atab="neg";go("adm");toast("Negocio guardado")})
  .catch(e=>{console.error(e);S.err=e&&e.code==="permission-denied"?"Sin permiso para guardar: revisa las reglas de Firestore.":"No se pudo guardar. Revisa tu internet e intenta de nuevo.";render(true)});
}
async function seedDemo(){
 try{
  let c=DB.colonias.find(x=>norm(x.n)==="centro"&&norm(x.loc)==="bucerias");
  if(!c){c={id:uid(),n:"Centro",loc:"Bucerías"};await setDoc(doc(fs,"colonias",c.id),{n:c.n,loc:c.loc});DB.colonias.push(c)}
  const base=JSON.parse(JSON.stringify(SEED.negocios[0]));const old=DB.negocios.find(x=>x.id==="mariscos-la-ola-prueba");
  const rec=old?{...old,menu:base.menu}:{...base,id:"mariscos-la-ola-prueba",col:c.id};
  await setDoc(doc(fs,"negocios",rec.id),toFS(rec));if(old)Object.assign(old,rec);else DB.negocios.push(rec);
  toast(old?"Menú de prueba con opciones cargado":"Restaurante de prueba cargado");render(true);
 }catch(e){fail(e);render(true)}

/* ---------- Bienvenida ---------- */
let OB={step:-1,sys:null};
try{if(!localStorage.getItem("gula_ob"))OB.step=0}catch(e){OB.step=0}
const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>';
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>';
const dots=n=>`<div class="dots">${[0,1,2].map(i=>`<i class="${i===n?"on":""}"></i>`).join("")}</div>`;
function renderOB(){
 const r=$("#obroot");
 if(OB.step<0){r.innerHTML="";return}
 let h="";
 if(OB.step===0)h=`<div class="ob welcome"><div class="in">
  <div class="bigname">Gula<span>.</span></div>
  <p>Todo lo que se te antoja en tu ciudad: comida, bares, estéticas y más.</p>
  <p style="font-size:15px;opacity:.85">Busca, ve el menú y pide por WhatsApp.</p>
  ${dots(0)}<button class="primary" data-ob="next">Comenzar</button></div></div>`;
 if(OB.step===1)h=`<div class="ob"><div class="in">${dots(1)}
  <h2>Habilitar ubicación</h2>
  <p class="lead">Gula usa tu ubicación mientras usas la app para mostrarte primero los negocios más cercanos a ti.</p>
  <div class="art">${PIN}</div>
  <button class="primary" data-ob="loc">Entendido</button>
  <button class="skip" data-ob="next">Ahora no</button>
  <p class="note" style="text-align:center;margin:0">Puedes cambiarlo cuando quieras en los ajustes de tu celular.</p></div></div>`;
 if(OB.step===2)h=`<div class="ob"><div class="in">${dots(2)}
  <h2>Activar notificaciones</h2>
  <p class="lead">Te avisamos cuando lleguen negocios nuevos a tu ciudad y cuando haya promociones cerca de ti.</p>
  <div class="art">${BELL}</div>
  <button class="primary" data-ob="noti">Entendido</button>
  <button class="skip" data-ob="next">Ahora no</button></div></div>`;
 if(OB.sys==="loc")h+=`<div class="sys-bg"><div class="sys" role="dialog" aria-label="Permiso de ubicación"><b>¿Permitir que <strong>Gula</strong> acceda a la ubicación de este dispositivo?</b>
  <button data-ob="next">Mientras la app está en uso</button><button data-ob="next">Solo esta vez</button><button data-ob="next">No permitir</button>
  <small>Imitación: este cuadro lo pone el celular, no la app.</small></div></div>`;
 if(OB.sys==="noti")h+=`<div class="sys-bg"><div class="sys" role="dialog" aria-label="Permiso de notificaciones"><b>¿Permitir que <strong>Gula</strong> te envíe notificaciones?</b>
  <button data-ob="next">Permitir</button><button data-ob="next">No permitir</button>
  <small>Imitación: este cuadro lo pone el celular, no la app.</small></div></div>`;
 r.innerHTML=h;
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-ob],[data-replay]");if(!t)return;
 e.stopPropagation();
 if(t.dataset.replay!==undefined){OB={step:0,sys:null};renderOB();return}
 const a=t.dataset.ob;
 if(a==="loc"){locate(true)}
 if(a==="noti"){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission().catch(()=>{})}catch(err){}}
 OB.sys=null;OB.step++;
 if(OB.step>2){OB.step=-1;try{localStorage.setItem("gula_ob","1")}catch(err){}}
 renderOB();
},true);

render();
renderOB();
/* La ciudad se vuelve a detectar cada vez que se abre Gula y al regresar a ella después de 20 minutos */
let LASTLOC=0;
function autoLocate(){if(Date.now()-LASTLOC<20*60*1000)return;
 try{if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:"geolocation"}).then(r=>{if(r.state==="granted"){LASTLOC=Date.now();locate(false)}}).catch(()=>{if(CITY.name){LASTLOC=Date.now();locate(false)}})}
  else if(CITY.name){LASTLOC=Date.now();locate(false)}}catch(e){}}
autoLocate();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")autoLocate()});
loadAll();
onAuthStateChanged(auth,u=>{const was=S.admin;S.admin=!!u&&isAdminEmail(u.email);if(S.admin!==was){LOADING=true;loadAll()}});
</script>
<script>
/* Actualización automática: compara la versión de este archivo con la que está en internet */
(function(){
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(r=>{try{r.update()}catch(e){}}).catch(()=>{});
 var V=(document.querySelector('meta[name="gula-version"]')||{}).content||"";var busy=false,last=0;
 function safe(){var v=document.getElementById("sheetroot"),o=document.getElementById("optroot"),rv=document.getElementById("revroot"),ad=document.getElementById("adroot");
  var open=[v,o,rv,ad].some(function(x){return x&&x.innerHTML.trim()});var a=document.activeElement;var typing=a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA");
  var adm=document.querySelector(".savebar");return !open&&!typing&&!adm}
 function banner(){if(document.getElementById("updbar"))return;var d=document.createElement("button");d.id="updbar";d.textContent="Hay una versión nueva de Gula · Toca para actualizar";
  d.style.cssText="position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;background:#F26A1B;color:#fff;border-radius:14px;padding:12px 14px;font:700 14px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)";
  d.onclick=function(){location.reload()};document.body.appendChild(d)}
 function check(){var now=Date.now();if(busy||now-last<60000)return;busy=true;last=now;
  fetch("index.html?u="+now,{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){var m=t.match(/name="gula-version" content="([^"]+)"/);
   if(m&&V&&m[1]!==V){if(safe())location.reload();else banner()}}).catch(function(){}).finally(function(){busy=false})}
 document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")check()});
 window.addEventListener("focus",check);setTimeout(check,4000);setInterval(check,5*60000);
})();
</script>
