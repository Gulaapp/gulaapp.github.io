<style>
/* Layout: app informativa de una columna para celular; encabezado fijo, lista de negocios y perfil con menú; pedidos por WhatsApp */
:root{
  --bg:#F6F4EE; --surface:#FFFFFF; --ink:#1B2A2A; --muted:#5E6B68; --line:#E3E0D6;
  --accent:#E8641E; --accent-ink:#FFFFFF; --sea:#0F6E6A; --sea-soft:#DCEDEA;
  --ok:#1F8A4C; --off:#A1453A; --chip:#ECE9E0; --wa:#1E9E55; --wa-ink:#FFFFFF;

  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A1A; --surface:#1A2524; --ink:#ECF1EF; --muted:#9DAAA6; --line:#2B3837;
  --accent:#F27A38; --accent-ink:#1A0D05; --sea:#5FC2B8; --sea-soft:#1E3533;
  --ok:#5BC98A; --off:#E08A7E; --chip:#223030; --wa:#3CC077; --wa-ink:#06200F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A1A; --surface:#1A2524; --ink:#ECF1EF; --muted:#9DAAA6; --line:#2B3837;
  --accent:#F27A38; --accent-ink:#1A0D05; --sea:#5FC2B8; --sea-soft:#1E3533;
  --ok:#5BC98A; --off:#E08A7E; --chip:#223030; --wa:#3CC077; --wa-ink:#06200F; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.logo span{color:var(--accent)}
.zone{font-size:12px;color:var(--muted)}
.zone b{color:var(--ink);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.search svg{flex:none;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.giros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px 4px;scroll-snap-type:x proximity}
.giros::-webkit-scrollbar{display:none}
.giro{flex:none;width:150px;scroll-snap-align:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.giro b{font-size:14px;line-height:1.2}
.giro small{font-size:11.5px;color:var(--muted);line-height:1.25}
.giro .gn{font-family:var(--display);font-weight:800;font-size:13px;color:var(--accent)}
.giro[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink)}
.subs{margin-top:10px}
.chip.sub{background:transparent;border:1px solid var(--line);font-weight:600;font-size:13px;padding:6px 12px}
.chip.sub[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin:6px 0 12px}
.link{font-size:12px;font-weight:700;color:var(--sea)}
h2.sec{font-family:var(--display);font-weight:800;font-size:19px;margin:18px 0 10px;text-wrap:balance}
.list{display:flex;flex-direction:column;gap:14px}
.card{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--surface);border-radius:var(--r);padding:10px;text-align:left;width:100%;border:1px solid var(--line)}
.ph{border-radius:10px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:28px;position:relative;overflow:hidden}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 8px,transparent 8px 18px)}
.ph span{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.card .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.card h3{margin:0;font-size:16px;font-weight:700;line-height:1.2}
.meta{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.open{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.closed{background:color-mix(in srgb,var(--off) 15%,transparent);color:var(--off)}
.star{color:var(--accent);font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 16px;line-height:1.4}
.hint b{color:var(--ink)}
.why{font-size:12.5px;font-weight:600;color:var(--sea)}
.explore{width:100%;margin-top:12px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px 16px;font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.subgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.subtile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:76px}
.subtile b{font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.subtile small{font-size:12px;color:var(--muted)}
.ad{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;width:100%}
.ad .ph{border-radius:0;aspect-ratio:16/9;font-size:44px}
.ad .ph em{position:absolute;top:10px;left:10px;z-index:1;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.45);color:#fff;padding:3px 8px;border-radius:999px;font-family:var(--body)}
.adb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.adb h3{margin:0;font-size:18px;font-weight:700}
.adb p{margin:2px 0 4px;font-size:14px}
.adcta{font-weight:700;color:var(--sea);font-size:14px}
.empty{padding:30px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
/* perfil */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:8px 0}
.hero{border-radius:var(--r);aspect-ratio:16/9;font-size:44px}
.dh{margin:14px 0 4px;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.about{margin:10px 0 14px;max-width:65ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.week{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-variant-numeric:tabular-nums}
.week .today{font-weight:700;color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gallery .ph{font-size:12px;font-family:var(--body);font-weight:700;align-items:end;justify-items:start;padding:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
.tabs::-webkit-scrollbar{display:none}
.menu-sec{scroll-margin-top:60px}
.menu-sec h4{font-family:var(--display);font-size:18px;margin:16px 0 4px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.item .n{font-weight:600}
.item .d{font-size:13px;color:var(--muted)}
.item .p{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.badge{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px}
.wabar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(transparent,var(--bg) 30%);padding-top:18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.wabtn{width:100%;max-width:528px;background:var(--wa);color:var(--wa-ink);border-radius:999px;padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.wanum{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
/* bienvenida */
.ob{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.ob .in{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px}
.ob.welcome{background:var(--accent);color:var(--accent-ink)}
.ob.welcome .bigname{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,110px);line-height:.9;letter-spacing:-.04em;margin-top:auto}
.ob.welcome p{font-size:19px;max-width:22ch;margin:0}
.primary{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px;font-weight:700;font-size:16px}
.ob.welcome .primary{background:var(--accent-ink);color:var(--accent)}
.ob h2{font-family:var(--display);font-weight:800;font-size:28px;margin:8px 0 0;text-wrap:balance}
.ob .lead{color:var(--muted);margin:0;max-width:40ch}
.ob .art{flex:1;display:grid;place-items:center;min-height:180px}
.ob .art svg{width:150px;height:150px;color:var(--sea)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--accent);width:20px}
.skip{font-weight:600;color:var(--muted);padding:10px;text-align:center;width:100%}
.ob.welcome .dots i{background:rgba(255,255,255,.4)}.ob.welcome .dots i.on{background:var(--accent-ink)}

.fl input,.fl select,.fl textarea,.mini{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:16px}

.hrow:last-child{border-bottom:0}

.msec-h{display:flex;gap:8px;align-items:center}
.mitem{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:1fr 110px;gap:8px}
.mini{padding:8px 10px;font-size:14px}
.addline{font-weight:700;color:var(--sea);padding:10px 0 2px;font-size:14px}
.err{color:var(--off);font-size:13.5px;font-weight:600;margin-top:10px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.savebar .btn2{border-radius:999px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.item.agot{opacity:.55}
.ph.photo::after{display:none}
.logo-btn{padding:0;text-align:left}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>

const $=s=>document.querySelector(s);
const money=n=>"$"+Number(n).toLocaleString("es-MX");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/^col(onia)?\.?\s+/,"").trim();
const hue=id=>[...String(id)].reduce((a,c)=>a+c.charCodeAt(0)*37,0)%360;
const initials=n=>{const w=String(n).replace(/^(Mariscos|Tacos|Café|Bar|Estética|Taquería|Restaurante)\s+/i,"").replace(/^(La|El|Los|Las)\s+/i,"").split(/\s+/).filter(Boolean);return (w.slice(0,2).map(x=>x[0]).join("")||"G").toUpperCase()};
function bgOf(b,i=0,l=58){const f=(b.fotos||[])[i];if(f)return `background:center/cover no-repeat url('${f}');`;const h=(hue(b.id)+i*25)%360;return `background:linear-gradient(140deg,hsl(${h} 62% ${l}%),hsl(${(h+35)%360} 58% ${l-16}%));`}
function phAttr(b,i=0,l=58,extra=""){return `class="ph${(b.fotos||[])[i]?" photo":""}" style="${bgOf(b,i,l)}${extra}"`}
function fmtH(h){h=+h;const x=h%24;return (x%12||12)+":00 "+(x>=12?"pm":"am")}
const today=()=>new Date().getDay();
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=s=>{if(!s)return "";const[y,m,d]=s.split("-");return `${+d}/${+m}/${y}`};
function todayHours(b){const t=b.hours[today()];return t?`Hoy ${fmtH(t[0])} a ${fmtH(t[1])}`:"Hoy cerrado"}
function isOpen(b){const t=b.hours[today()];if(!t)return false;const hr=new Date().getHours();return t[1]>t[0]?(hr>=t[0]&&hr<t[1]):(hr>=t[0]||hr<t[1])}
const colOf=b=>DB.colonias.find(c=>c.id===b.col)||{n:"Sin colonia",loc:""};
const waShow=w=>String(w).replace(/(\d{3})(\d{3})(\d{4})/,"$1 $2 $3");
const waLink=b=>`https://wa.me/52${b.wa}?text=${encodeURIComponent(`Hola ${b.n}, vi su menú en Gula y quiero hacer un pedido.`)}`;
const adActive=b=>b.ad&&b.ad.on&&(!b.ad.vence||b.ad.vence>=todayISO());
const visibles=()=>DB.negocios.filter(b=>b.visible);
const allDishes=b=>(b.menu||[]).flatMap(m=>m.items||[]);

function giroResults(G){
 const q=norm(S.gq);
 const res=visibles().filter(b=>b.g===G.k).map(b=>{const c=colOf(b);const why=[];
  if(norm(c.n).includes(q)||norm(c.loc).includes(q)||norm(b.calle).includes(q))why.push("Col. "+c.n+", "+c.loc);
  const dishes=allDishes(b).filter(i=>norm(i.n+" "+(i.d||"")).includes(q)).map(i=>i.n);
  if(dishes.length)why.push("Vende: "+dishes.slice(0,3).join(", "));
  if(!why.length&&norm(b.n+" "+b.s).includes(q))why.push(b.s);
  return why.length?{b,why:why.join(" · ")}:null}).filter(Boolean);
 return `<h2 class="sec" style="margin-top:0">${res.length} ${res.length===1?"resultado":"resultados"} para "${esc(S.gq.trim())}"</h2>
 <div class="list">${res.length?res.map(r=>card(r.b,r.why)).join(""):`<div class="empty">Ningún negocio de ${G.n} coincide con "${esc(S.gq.trim())}". Prueba con otra colonia o platillo.</div>`}</div>`}

 <div class="box"><h3>Servicios</h3><div class="checks">${EXTRAS.map((x,i)=>`<label class="ck"><input type="checkbox" data-ex="${i}" ${D.extras.includes(x)?"checked":""}> ${x}</label>`).join("")}</div></div>
 <div class="box"><h3>Fotos</h3><p class="meta" style="margin:0">Hasta 4. La primera es la portada.</p>
  ${D.fotos.length?`<div class="thumbs">${D.fotos.map((f,i)=>`<div class="thumb" style="background-image:url('${f}')">${i===0?'<span class="cv">Portada</span>':""}<div class="tb">${i?`<button data-fcover="${i}">Portada</button>`:""}<button data-fdel="${i}">Quitar</button></div></div>`).join("")}</div>`:""}
  ${D.fotos.length<4?`<label class="upload" for="f_fotos">+ Subir fotos<input id="f_fotos" type="file" accept="image/*" multiple></label>`:""}
 </div>
 <div class="box"><h3>Menú</h3><p class="meta" style="margin:0">Agrega secciones (Entradas, Bebidas…) y dentro sus productos con precio.</p>
  ${D.menu.map((m,si)=>`<div class="msec"><div class="msec-h"><input class="mini" data-mt="${si}" value="${esc(m.t)}" placeholder="Nombre de la sección" aria-label="Nombre de la sección"><button class="btn2 danger" data-mdel="${si}">Quitar</button></div>
   ${m.items.map((it,ii)=>`<div class="mitem"><div class="mrow"><input class="mini" data-mi="${si},${ii},n" value="${esc(it.n)}" placeholder="Producto" aria-label="Producto"><input class="mini" data-mi="${si},${ii},p" value="${it.p??""}" inputmode="decimal" placeholder="Precio $" aria-label="Precio"></div>
    <input class="mini" data-mi="${si},${ii},d" value="${esc(it.d)}" placeholder="Descripción (opcional)" aria-label="Descripción">
    <div class="checks" style="margin-top:0"><label class="ck"><input type="checkbox" data-mc="${si},${ii},desde" ${it.desde?"checked":""}> Desde</label><label class="ck"><input type="checkbox" data-mc="${si},${ii},fav" ${it.fav?"checked":""}> El favorito</label><label class="ck"><input type="checkbox" data-mc="${si},${ii},agot" ${it.agot?"checked":""}> Agotado</label><button class="btn2 danger" data-midel="${si},${ii}">Quitar</button></div></div>`).join("")}
   <button class="addline" data-madd="${si}">+ Agregar producto</button></div>`).join("")}
  <button class="addline" data-act="addsec">+ Agregar sección</button>
 </div>
 <div class="box"><h3>Publicidad y visibilidad</h3>
  <div class="checks"><label class="ck"><input type="checkbox" data-f="ad.on" ${D.ad.on?"checked":""}> Aparece en Publicidad</label><label class="ck"><input type="checkbox" data-f="visible" ${D.visible?"checked":""}> Visible en la app</label></div>
  <label class="fl" for="f_adv">Publicidad vence el<input id="f_adv" type="date" data-f="ad.vence" value="${esc(D.ad.vence)}"><small>Déjalo vacío si no vence.</small></label>
 </div>
 ${S.err?`<div class="err">${esc(S.err)}</div>`:""}
 <div class="savebar"><div class="in"><button class="btn2" data-act="cancel">Cancelar</button><button class="primary" data-act="save" style="padding:12px">Guardar negocio</button></div></div>`}

/* ---------- Render ---------- */
function render(keepScroll){
 const y=window.scrollY;
 const v=S.view;
 $("#app").innerHTML=v==="detail"?detail():v==="sub"?subView():v==="giro"?giroView():v==="login"?loginView():v==="adm"?admView():v==="edit"?editView():home();
 const b=v==="detail"&&DB.negocios.find(x=>x.id===S.biz);
 $("#warroot").innerHTML=b?`<div class="wabar"><div style="width:100%;max-width:528px"><a class="wabtn" href="${waLink(b)}" target="_blank" rel="noopener">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.4-.3z"/></svg>
  Pedir por WhatsApp</a><div class="wanum">Se abre WhatsApp con el negocio · ${waShow(b.wa)}</div></div></div>`:"";
 window.scrollTo(0,keepScroll?y:0);
}
let toastT;function toast(msg){$("#toastroot").innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{$("#toastroot").innerHTML=""},2600)}
const go=v=>{S.view=v;S.err="";S.confirm=null;render()};

/* ---------- Fotos: se reducen para que pesen poco ---------- */
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
 img.onload=()=>{const m=720,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.62))};
 img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

/* ---------- Eventos ---------- */
let taps=[];
document.addEventListener("input",e=>{
 const t=e.target,id=t.id;
 if(id==="q"||id==="gq"){S[id]=t.value;const pos=t.selectionStart;render(true);const i=document.getElementById(id);i.focus();try{i.setSelectionRange(pos,pos)}catch(err){}return}
 if(S.view!=="edit")return;const D=S.draft;
 if(t.dataset.f&&t.type!=="checkbox"&&t.tagName!=="SELECT"){setPath(D,t.dataset.f,t.value);return}
 if(t.dataset.mt!==undefined){D.menu[+t.dataset.mt].t=t.value;return}
 if(t.dataset.mi){const[si,ii,f]=t.dataset.mi.split(",");D.menu[+si].items[+ii][f]=t.value;return}
});
function setPath(o,p,v){const k=p.split(".");let x=o;while(k.length>1)x=x[k.shift()];x[k[0]]=v}
document.addEventListener("change",e=>{
 const t=e.target;if(S.view!=="edit")return;const D=S.draft;
 if(t.id==="f_fotos"){const files=[...t.files].slice(0,4-D.fotos.length);Promise.all(files.map(f=>shrink(f).catch(()=>null))).then(r=>{const ok=r.filter(Boolean);D.fotos.push(...ok);if(ok.length<files.length)S.err="Alguna foto no se pudo leer. Intenta con otra.";render(true)});return}
 if(t.dataset.f){const v=t.type==="checkbox"?t.checked:t.value;setPath(D,t.dataset.f,v);if(t.dataset.f==="g"){D.s=GIROS.find(x=>x.k===v).subs[0];render(true)}return}
 if(t.dataset.hon!==undefined){const d=+t.dataset.hon;D.hours[d]=t.checked?[9,18]:null;render(true);return}
 if(t.dataset.ho){const[d,k]=t.dataset.ho.split(",").map(Number);if(D.hours[d])D.hours[d][k]=+t.value;return}
 if(t.dataset.ex!==undefined){const x=EXTRAS[+t.dataset.ex];D.extras=t.checked?[...D.extras,x]:D.extras.filter(y=>y!==x);return}
 if(t.dataset.mc){const[si,ii,f]=t.dataset.mc.split(",");D.menu[+si].items[+ii][f]=t.checked;return}
});
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.logo!==undefined){const now=Date.now();taps=taps.filter(x=>now-x<1500);taps.push(now);if(taps.length>=3){taps=[];go(S.admin?"adm":"login")}return}
 if(d.giro){S.giro=d.giro;S.sub=null;S.q="";render(true);return}
 if(d.sub){S.sub=d.sub;go("sub");return}
 if(d.biz){S.from=S.view;S.biz=d.biz;go("detail");return}
 if(d.go){if(d.go==="back")return go(S.from||"home");if(d.go==="home")S.sub=null;return go(d.go)}
 if(d.jump){document.getElementById(d.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
 if(d.tab){S.atab=d.tab;S.err="";S.confirm=null;render();return}
 if(d.edit){const b=DB.negocios.find(x=>x.id===d.edit);S.draft=JSON.parse(JSON.stringify(b));S.draft.menu.forEach(m=>m.items=m.items||[]);S.draft.ad=S.draft.ad||{on:false,vence:""};S.draft.extras=S.draft.extras||[];S.draft.fotos=S.draft.fotos||[];go("edit");return}
 if(d.toggle){const b=DB.negocios.find(x=>x.id===d.toggle);const v=!b.visible;updateDoc(doc(fs,"negocios",b.id),{visible:v}).then(()=>{b.visible=v;toast(v?"Ahora se ve en la app":"Oculto de la app");render(true)}).catch(fail);return}
 if(d.del){if(S.confirm!==d.del){S.confirm=d.del;render(true);return}const id=d.del;S.confirm=null;deleteDoc(doc(fs,"negocios",id)).then(()=>{DB.negocios=DB.negocios.filter(x=>x.id!==id);toast("Negocio eliminado");render(true)}).catch(fail);return}
 if(d.delcol){if(S.confirm!==d.delcol){S.confirm=d.delcol;render(true);return}const id=d.delcol;S.confirm=null;deleteDoc(doc(fs,"colonias",id)).then(()=>{DB.colonias=DB.colonias.filter(x=>x.id!==id);toast("Colonia eliminada");render(true)}).catch(fail);return}
 if(S.view==="edit"){const D=S.draft;
  if(d.fdel!==undefined){D.fotos.splice(+d.fdel,1);render(true);return}
  if(d.fcover!==undefined){const[f]=D.fotos.splice(+d.fcover,1);D.fotos.unshift(f);render(true);return}
  if(d.mdel!==undefined){D.menu.splice(+d.mdel,1);render(true);return}
  if(d.madd!==undefined){D.menu[+d.madd].items.push({n:"",d:"",p:""});render(true);return}
  if(d.midel){const[si,ii]=d.midel.split(",").map(Number);D.menu[si].items.splice(ii,1);render(true);return}
 }
 const a=d.act;if(!a)return;
 if(a==="login"){const em=$("#l_e").value.trim(),pw=$("#l_p").value;if(!em||!pw){S.err="Escribe tu correo y tu contraseña.";render(true);return}if(em.toLowerCase()!=="publicidadgasca@gmail.com"){S.err="Ese correo no tiene acceso a la Administración de Gula.";render(true);return}t.disabled=true;t.textContent="Entrando…";
  signInWithEmailAndPassword(auth,em,pw).then(()=>{S.admin=true;S.atab="neg";LOADING=true;go("adm");loadAll()}).catch(e=>{S.err=e.code==="auth/too-many-requests"?"Demasiados intentos. Espera unos minutos.":"Correo o contraseña incorrectos.";render(true)});return}
 if(a==="reset"){sendPasswordResetEmail(auth,ADMIN).then(()=>toast("Te enviamos un correo para cambiar tu contraseña")).catch(()=>toast("No se pudo enviar el correo. Intenta más tarde."));return}
 if(a==="seed"){t.disabled=true;seedDemo();return}
 if(a==="logout"){signOut(auth);S.admin=false;go("home");loadAll();return}
 if(a==="viewapp"){go("home");return}
 if(a==="new"){S.draft=blankNeg();go("edit");return}
 if(a==="cancel"){S.draft=null;go("adm");return}
 if(a==="addsec"){S.draft.menu.push({t:"",items:[{n:"",d:"",p:""}]});render(true);return}
 if(a==="addcol"){const n=$("#c_n").value.trim(),l=$("#c_l").value.trim();
  if(!n||!l){S.err="Escribe la colonia y su localidad.";render(true);return}
  if(DB.colonias.some(c=>norm(c.n)===norm(n)&&norm(c.loc)===norm(l))){S.err=`"${n}" ya está registrada en ${l}.`;render(true);return}
  const id=uid();setDoc(doc(fs,"colonias",id),{n,loc:l}).then(()=>{DB.colonias.push({id,n,loc:l});S.err="";toast("Colonia agregada");render(true)}).catch(fail);return}
 if(a==="save")return saveDraft();
});

function saveDraft(){
 const D=S.draft;const errs=[];
 D.n=D.n.trim();D.calle=D.calle.trim();D.about=D.about.trim();D.wa=String(D.wa).replace(/\D/g,"");
 if(!D.n)errs.push("el nombre");
 if(!D.calle)errs.push("calle y número");
 if(!D.col)errs.push("la colonia");
 if(!/^\d{10}$/.test(D.wa))errs.push("WhatsApp de 10 dígitos");
 const menu=D.menu.map(m=>({t:m.t.trim(),items:m.items.filter(i=>String(i.n).trim()).map(i=>({...i,n:String(i.n).trim(),d:String(i.d||"").trim(),p:i.p===""?NaN:Number(String(i.p).replace(/[^\d.]/g,""))}))})).filter(m=>m.items.length||m.t);
 if(menu.some(m=>!m.t))errs.push("nombre de cada sección del menú");
 if(menu.some(m=>m.items.some(i=>!isFinite(i.p))))errs.push("precio de cada producto");
 if(errs.length){S.err="Falta: "+errs.join(", ")+".";render(true);return}
 const rec={...D,menu,hours:D.hours.map(h=>h?[+h[0],+h[1]]:null)};
 if(!rec.id)rec.id=uid();
 const data=toFS(rec);
 if(JSON.stringify(data).length>950000){S.err="Las fotos pesan demasiado. Quita una foto e intenta de nuevo.";render(true);return}
 const btn=document.querySelector('[data-act="save"]');if(btn){btn.disabled=true;btn.textContent="Guardando…"}
 setDoc(doc(fs,"negocios",rec.id),data).then(()=>{const i=DB.negocios.findIndex(x=>x.id===rec.id);if(i>=0)DB.negocios[i]=rec;else DB.negocios.push(rec);S.draft=null;S.atab="neg";go("adm");toast("Negocio guardado")})
  .catch(e=>{console.error(e);S.err=e&&e.code==="permission-denied"?"Sin permiso para guardar: revisa las reglas de Firestore.":"No se pudo guardar. Revisa tu internet e intenta de nuevo.";render(true)});
}
async function seedDemo(){
 try{
  let c=DB.colonias.find(x=>norm(x.n)==="centro"&&norm(x.loc)==="bucerias");
  if(!c){c={id:uid(),n:"Centro",loc:"Bucerías"};await setDoc(doc(fs,"colonias",c.id),{n:c.n,loc:c.loc});DB.colonias.push(c)}
  const rec={...JSON.parse(JSON.stringify(SEED.negocios[0])),id:"mariscos-la-ola-prueba",col:c.id};
  await setDoc(doc(fs,"negocios",rec.id),toFS(rec));DB.negocios.push(rec);toast("Restaurante de prueba cargado");render(true);
 }catch(e){fail(e);render(true)}
}

/* ---------- Bienvenida ---------- */
let OB={step:-1,sys:null};
try{if(!localStorage.getItem("gula_ob"))OB.step=0}catch(e){OB.step=0}
const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>';
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>';
const dots=n=>`<div class="dots">${[0,1,2].map(i=>`<i class="${i===n?"on":""}"></i>`).join("")}</div>`;
function renderOB(){
 const r=$("#obroot");
 if(OB.step<0){r.innerHTML="";return}
 let h="";
 if(OB.step===0)h=`<div class="ob welcome"><div class="in">
  <div class="bigname">Gula.</div>
  <p>Todo lo que se te antoja en tu ciudad: comida, bares, estéticas y más.</p>
  <p style="font-size:15px;opacity:.85">Busca, ve el menú y pide por WhatsApp.</p>
  ${dots(0)}<button class="primary" data-ob="next">Comenzar</button></div></div>`;
 if(OB.step===1)h=`<div class="ob"><div class="in">${dots(1)}
  <h2>Habilitar ubicación</h2>
  <p class="lead">Gula usa tu ubicación mientras usas la app para mostrarte primero los negocios más cercanos a ti.</p>
  <div class="art">${PIN}</div>
  <button class="primary" data-ob="loc">Entendido</button>
  <button class="skip" data-ob="next">Ahora no</button>
  <p class="note" style="text-align:center;margin:0">Puedes cambiarlo cuando quieras en los ajustes de tu celular.</p></div></div>`;
 if(OB.step===2)h=`<div class="ob"><div class="in">${dots(2)}
  <h2>Activar notificaciones</h2>
  <p class="lead">Te avisamos cuando lleguen negocios nuevos a tu ciudad y cuando haya promociones cerca de ti.</p>
  <div class="art">${BELL}</div>
  <button class="primary" data-ob="noti">Entendido</button>
  <button class="skip" data-ob="next">Ahora no</button></div></div>`;
 if(OB.sys==="loc")h+=`<div class="sys-bg"><div class="sys" role="dialog" aria-label="Permiso de ubicación"><b>¿Permitir que <strong>Gula</strong> acceda a la ubicación de este dispositivo?</b>
  <button data-ob="next">Mientras la app está en uso</button><button data-ob="next">Solo esta vez</button><button data-ob="next">No permitir</button>
  <small>Imitación: este cuadro lo pone el celular, no la app.</small></div></div>`;
 if(OB.sys==="noti")h+=`<div class="sys-bg"><div class="sys" role="dialog" aria-label="Permiso de notificaciones"><b>¿Permitir que <strong>Gula</strong> te envíe notificaciones?</b>
  <button data-ob="next">Permitir</button><button data-ob="next">No permitir</button>
  <small>Imitación: este cuadro lo pone el celular, no la app.</small></div></div>`;
 r.innerHTML=h;
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-ob],[data-replay]");if(!t)return;
 e.stopPropagation();
 if(t.dataset.replay!==undefined){OB={step:0,sys:null};renderOB();return}
 const a=t.dataset.ob;
 if(a==="loc"||a==="noti"){OB.sys=a;renderOB();return}
 OB.sys=null;OB.step++;
 if(OB.step>2){OB.step=-1;try{localStorage.setItem("gula_ob","1")}catch(err){}}
 renderOB();
},true);

render();
renderOB();
loadAll();
onAuthStateChanged(auth,u=>{const was=S.admin;S.admin=!!u&&u.email===ADMIN;if(S.admin!==was){LOADING=true;loadAll()}});
</script>
